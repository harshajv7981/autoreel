# AutoReel configuration. Paths are relative to this file.

paths:
  data: ./data                 # downloads, work files, renders
  music: ./music               # drop royalty-free tracks here (e.g. Mixkit, no account needed)
  secrets: ./secrets           # client_secret.json + per-channel tokens (never commit)
  state_db: ./data/autoreel.db

llm:
  provider: anthropic          # anthropic (Claude API) | ollama (local, free) | none (templates only)
  # Claude: set the key as an environment variable, never in this file:  export ANTHROPIC_API_KEY=...
  anthropic_text_model: claude-sonnet-5-5    # captions, hooks, trend planning
  anthropic_vision_model: claude-haiku-5-5   # rates frames of candidate moments (runs most often)
  max_tokens: 1500
  temperature: 0.8
  # Ollama alternative (local, no key)
  ollama_url: http://localhost:11434
  text_model: qwen2.5:7b
  vision_model: qwen2.5vl:7b

policy:
  # US public domain: works published in year Y are public domain from Jan 1 of Y+96.
  # The cutoff year is computed automatically from today's date.
  trusted_pd_collections: [prelinger, prelinger_library, ephemera]  # vetted by the archive itself
  # US federal government works are public domain whatever their year (17 U.S.C. 105)
  gov_collections: [fedflix, nasa, usnationalarchives, nationalarchives]
  # Collections a rights-holder released into the public domain, accepted within their years
  pd_releases:
    - match: universal newsreel          # MCA/Universal gave its 1929-1967 newsreels to the
      years: [1929, 1967]                # National Archives without copyright restrictions
      reason: Universal Newsreels, released into the public domain by MCA/Universal
  blocked_terms: [ai generated, ai-generated, generated with, midjourney, sora, runway gen,
                  stable diffusion, synthetic, deepfake, "made with ai", colorized, colourized,
                  upscaled, "ai restored", "ai enhanced"]
  # Versions that third parties fingerprint in Content ID: new scans, restorations, added scores,
  # and re-uploads from archives that file claims on their own copies of public-domain film.
  content_id_risk_terms: [restored, restoration, remaster, remastered, " 4k", "4k ", " hd ", "hd version",
                          "1080p", "60fps", "new score", "new music", "musical score by", "soundtrack by",
                          "british pathe", "british pathé", "pathe news", "reuters", "ap archive",
                          "periscope film", "periscopefilm", "criticalpast", "critical past",
                          "huntley film", "kinolibrary", "pond5", "getty images", "shutterstock",
                          "film archives inc", "watermark", "movietone", "gaumont", "hearst metrotone",
                          "metrotone", "screenocean", "itn source", " bfi ", "films division",
                          "star sports", "sky sports", "espn", "bcci", "icc ", "fifa+", "premier league productions"]
  max_clips_per_source: 6      # don't milk a single film forever

trends:
  feeds: [wikipedia_top, on_this_day]   # keyless Wikipedia feeds
  # Topics that pay best for an India-based channel aimed at US/UK viewers get a ranking boost
  boost_terms: [nasa, apollo, artemis, moon, lunar, mars, orbit, astronaut, launch, space, rocket, aviation, aircraft, airship, zeppelin, railroad, railway,
                locomotive, ship, submarine, navy, cold war, nuclear, atomic, bomb test, engineering,
                bridge, dam, tunnel, invention, inventor, computer, radio, television, automobile,
                world war, wwii, d-day, depression, prohibition, hollywood, silent film, newsreel]
  top_n: 60                    # how many of yesterday's most-read articles to consider
  max_topics: 8                # topics planned per day (cached in data/trends_<date>.json)

compose:
  renderer: ffmpeg             # ffmpeg (fast) | hyperframes (animated text; needs Node 22+)
  audio: original              # original (the clip's own sound) | none | music (from ./music)
  mute_before_year: 1928       # silent-era films: any soundtrack was added later (often copyrighted) -> mute
  layouts: [top_hook, boxed, lower_third, minimal, label, headline]   # rotated per clip
  frames: [blur, square, card]
  width: 1080
  height: 1920
  crf: 20
  preset: veryfast
  loudness_lufs: -14
  music_volume: 0.85
  grain: true                  # subtle film grain + slight colour variance so renders don't look templated
  hyperframes_version: 0.9.65

shorts:
  max_seconds: 58              # Shorts over 1 minute are BLOCKED if they get any Content ID claim

finder:
  analysis_fps: 4
  skip_edges: 0.06             # ignore first/last 6% (titles, credits)
  candidates_per_source: 8

longform:
  enabled: true
  every_days: 7                # one compilation per channel per week
  lookback_days: 10
  min_parts: 6                 # wait until this many approved Shorts exist
  max_parts: 12
  target_minutes: 9            # parts get extra context around each moment to reach this
  max_context: 25              # seconds of context added on each side, at most
  publish_slots: ["20:30"]     # local time for long-form uploads

review:
  require_approval: true       # nothing goes public until you approve it
  telegram_bot_token: null     # optional: approve from your phone (see README)
  telegram_chat_id: null

youtube:
  client_secret: ./secrets/client_secret.json
  category_id: "24"            # 24 = Entertainment
  made_for_kids: false
  default_language: en
  max_uploads_per_day: 6       # across all channels; API default bucket is 100/day
  set_thumbnail: true          # long-form thumbnails (needs a phone-verified channel: youtube.com/verify)
  schedule:
    timezone: Asia/Kolkata
    slots: ["12:40", "19:10"]  # local times; each slot gets one Short per channel
    jitter_minutes: 11         # small random offset so posting times look human
    min_lead_minutes: 45

channels:
  - name: archive-trends       # flagship: real archival footage behind what people are reading about today
    enabled: true
    token: ./secrets/token_archive-trends.json
    playlist_id: null
    voice: >-
      Curious and precise, like a historian who loves a good surprise. Connects today's news to
      real footage from the past. Plain words, no hype.
    clip_seconds: [20, 45]
    buffer: 4
    sources:
      - type: trends           # Wikipedia most-read + On this day -> archive searches
        archives: [internet_archive, nasa]
        per_topic: 1
      # evergreen fallback when no trend has footage today
      - type: internet_archive
        query: 'collection:(Prelinger_Library OR prelinger) AND subject:(technology OR invention OR transportation)'
      - type: internet_archive   # US government films: Cold War, aviation, engineering
        query: 'collection:(FedFlix) AND subject:(aviation OR nuclear OR space OR engineering OR navy)'
    tags: [history, archive footage, on this day, vintage, documentary]

  - name: sports-action-history   # real sports and stunts from 1900-1967 newsreels; never modern matches
    enabled: true
    token: ./secrets/token_sports-action-history.json
    playlist_id: null
    voice: >-
      Energetic but plain-spoken, like a sports historian who can't believe what athletes did back then.
      Short sentences. Always makes clear the footage is decades old.
    judge_hint: >-
      Score the peak of the action highest: a knockout, a goal or touchdown, a crash, a photo finish,
      a stunt landing. Low scores for crowd shots, line-ups and people standing around.
    clip_seconds: [12, 30]
    buffer: 4
    sources:
      - type: trends           # when a sport trends (World Cup, Ashes, IPL, Olympics), show how it looked then
        archives: [internet_archive]
        allow_sports: true
        sports_only: true
        per_topic: 1
      - type: internet_archive   # Universal Newsreels 1929-1967 (public domain)
        query: 'title:("universal newsreel") AND (description:(sports OR boxing OR baseball OR football OR soccer OR racing OR olympics OR rodeo OR stunt OR air race) OR subject:(sports))'
      - type: internet_archive   # pre-{pd_cutoff} films: early sport, motor racing, aviation stunts, silent-film stunts
        query: '(subject:(boxing OR baseball OR football OR soccer OR cricket OR "auto racing" OR olympics OR rodeo OR "air race" OR stunt OR "Harold Lloyd" OR "Buster Keaton" OR "Douglas Fairbanks")) AND year:[1895 TO {pd_cutoff}]'
    tags: [sports history, vintage sports, boxing, football history, old newsreel, stunts]

  - name: cricket-football-stats   # animated stat Shorts from match data: no footage, photos or logos
    enabled: true
    token: ./secrets/token_cricket-football-stats.json
    playlist_id: null
    longform: false
    voice: >-
      A sharp, slightly cheeky stats nerd. Leads with the most surprising number. Short, punchy, plain words.
    clip_seconds: [15, 45]
    buffer: 4
    sources:
      - type: stats            # Cricsheet ball-by-ball data (credit Cricsheet in every description)
        sport: cricket
        competitions: [ipl, t20is, odis, tests]
        gender: male
        min_balls_economy: 600 # 100 overs minimum for economy rankings
      - type: stats            # openfootball results (public domain)
        sport: football
        leagues: [en.1, es.1, it.1, de.1]
        first_season: 2010
    tags: [cricket stats, ipl, football stats, premier league, sports data]

  - name: classic-comedy
    enabled: false
    token: ./secrets/token_classic-comedy.json
    playlist_id: null
    voice: >-
      Dry, playful, a little cheeky. Talks like a film nerd showing a friend a gag.
      Never shouts, never uses hype words.
    clip_seconds: [18, 40]
    buffer: 4                  # keep this many Shorts ready ahead of schedule
    sources:
      - type: internet_archive
        query: 'collection:(silent_films) AND (subject:(comedy) OR subject:(slapstick) OR collection:(Comedy_Films))'
      - type: internet_archive
        query: 'subject:("Charlie Chaplin" OR "Buster Keaton" OR "Harold Lloyd" OR "Laurel and Hardy")'
    tags: [silent film, classic comedy, slapstick, old movies, film history]

  - name: space-moments
    enabled: false
    token: ./secrets/token_space-moments.json
    playlist_id: null
    voice: Calm, curious, precise. Shares one surprising fact per clip.
    clip_seconds: [15, 35]
    buffer: 4
    sources:
      - type: nasa
        query: rocket launch
      - type: nasa
        query: spacewalk
    tags: [space, nasa, rocket launch, astronomy]

  - name: wild-animals
    enabled: false
    token: ./secrets/token_wild-animals.json
    playlist_id: null
    voice: Warm and observant, like a park ranger who loves their job.
    clip_seconds: [15, 35]
    buffer: 4
    sources:
      # Download public-domain b-roll from NPS / USGS / USFWS pages into this folder
      # and put a licence.json next to the files (see README).
      - type: local
        folder: ./inbox/animals
    tags: [wildlife, animals, nature, national parks]
